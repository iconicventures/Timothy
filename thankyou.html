<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Timothy Grant Financial</title>
    <link rel="icon" type="image/jpeg" href="images/logo.jpg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .thankyou-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }
        .thankyou-content {
            max-width: 600px;
        }
        .thankyou-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #1a365d;
            margin-bottom: 1rem;
        }
        .thankyou-content p {
            font-size: 1.1rem;
            color: #4a5568;
            margin-bottom: 2rem;
            line-height: 1.7;
        }
        .thankyou-content .btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            background-color: #1a365d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .thankyou-content .btn:hover {
            background-color: #2d4a7a;
        }
    </style>
</head>
<body>
    <section class="thankyou-section">
        <div class="thankyou-content">
            <h1>Thank You!</h1>
            <p>Your message has been sent successfully. Our team at Timothy Grant Financial will get back to you shortly.</p>
            <a href="index.html" class="btn">Back to Home</a>
        </div>
    </section>
</body>
</html>
